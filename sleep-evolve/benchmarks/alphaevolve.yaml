# AlphaEvolve benchmark registry: what every run is scored against.
#
# Every number cites its source. Values were extracted as DATA from the sources below (problem
# pages parsed from their embedded JS `problemData`, notebooks read as JSON with ast.literal_eval;
# no notebook code was executed). "computed" values were obtained by applying a rewritten port of
# the notebook's own scoring formula to the published construction; the notebook's printed/stated
# rounded value is cited next to it.
#
# Conventions
#   direction        maximize | minimize the published quantity (`value`)
#   score_transform  how our evaluators turn `value` into a higher-is-better score:
#                    identity (score = value) | negate (score = -value for minimization)
#   instances        every instance AlphaEvolve reported. A run is scored against the instance whose
#                    `params` equal the params its evaluator declares (benchmarks/evaluator_instances.py);
#                    anything else is refused as an instance mismatch.
#   evaluator        "module:Class" once an evaluator exists and its construction is verified,
#                    otherwise "pending" (verification skipped, scoring refused).
#   value records    {value, source, note?, missing_note?}; value: null requires missing_note.
#   match_tolerance  absolute tolerance in score units for matched_ae / beat_ae.
#   verification_tolerance  absolute tolerance for reproducing alphaevolve_value from the construction.

schema_version: 1
retrieved: "2026-11-14"
sources:
  repo: "https://github.com/google-deepmind/alphaevolve_repository_of_problems (branch main, fetched 2026-11-14)"
  status_json: "alphaevolve_repository_of_problems/status.json"
  paper: "arXiv:2511.02864v3 (HTML). Paper problem labels 'Problem 6.N' equal repo problem numbers N; problem pages cite subsection numbers ('Section 6.19' = Section 6, subsection 19)."
  results_colab: "https://github.com/google-deepmind/alphaevolve_results/blob/master/mathematical_results.ipynb (May 2025 results colab)"
status_labels:   # status.json key -> registry status (identity today; problems absent from status.json are `unlisted`)
  world_record: world_record
  former_record: former_record
  worse_than_record: worse_than_record
  matched_optimal: matched_optimal

