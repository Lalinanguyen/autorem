[project]
name = "sleep-evolve"
version = "0.1.0"
description = "Sleep-time consolidation for LLM-driven evolutionary program search"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "openai>=1.40",
    "modal>=1.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
